[project]
name = "fridgeai"
version = "0.1.0"
description = "智能冰箱食材管理与菜谱推荐系统 — FastAPI + LangGraph 1.x 多智能体助手"
requires-python = ">=3.12"
dependencies = [
    # --- LangChain / LangGraph 1.x 核心 (同 minor 冻结, 贴近已验证的 conda 环境) ---
    "langchain~=1.3.0",
    "langchain-core~=1.4.0",
    "langchain-openai~=1.3.0",
    "langchain-huggingface~=1.2.0",   # HuggingFaceEmbeddings (rag_modules/milvus_index_construction.py)
    "langchain-community~=0.4.0",     # BM25Retriever (rag_modules/hybrid_retrieval.py)
    "langgraph~=1.2.0",
    "langgraph-checkpoint-postgres~=3.1.0",
    # --- 持久化 ---
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    # --- Web 框架 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "httpx>=0.27",
    # --- 数据层 / 检索 ---
    "neo4j>=5.20",
    "pymilvus>=2.5",
    "numpy>=1.24",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    # --- LLM (OpenAI 兼容端点) ---
    "openai>=1.104",
    # --- 配置 ---
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
eval = [
    "ragas~=0.4.0",
    "langsmith>=0.7",
    "deepeval~=4.0.0",
]

[tool.uv]
package = false

# ─────────────────────────────────────────────────────────────
# Ruff — 代码检查
#
# CI 的【阻塞】门禁只选 E9,F63,F7,F82 (语法错误 / 未定义名 / 失效断言),
# 即"会让程序真的崩掉"的那一类, 见 .github/workflows/ci.yml。
# 下面这份 select/ignore 是【本地全量检查】用的规则集, 风格债在 CI 中
# 以非阻塞方式报告, 不阻断合并。
#
# pytest 配置故意不放在这里 —— 见 tests/pytest.ini (它优先级更高,
# 两处并存会造成配置来源歧义)。
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", ".venv", "unpackage"]

[tool.ruff.lint]
# 不选 W: 该组几乎全是空白符警告(W291/W293/W292 共 400+),
# 信噪比过低会淹没真正的问题。空白清理留待独立的格式化提交。
select = ["E", "F"]
ignore = [
    "E401",  # `import os, json` —— 本仓库既有的紧凑导入风格
    "E402",  # 惰性导入: 重依赖延迟到模块中部 import, 缩短启动耗时
    "E501",  # 行宽交由 line-length 处理
    "E701",  # `if x: return` 紧凑单行
    "E702",  # `a = 1; b = 2` 紧凑单行
    "E741",  # 图算法里的 `l` 等惯用短名
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]      # 包导出面, 重导出不算未使用
"tests/**" = ["F401", "F841"] # 测试中的夹具导入与占位变量
